services:
  - type: web
    name: dragonboy-web-online
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCDynamicAdaptationMode
        value: "0"
      - key: DOTNET_GCHighMemPercent
        value: "75"
      - key: PORT
        value: "10000"
